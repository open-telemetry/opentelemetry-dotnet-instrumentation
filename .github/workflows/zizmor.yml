name: zizmor scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  FORCE_COLOR: 3
  TERM: xterm

jobs:
  zizmor:
    name: Zizmor Security Analysis
    permissions:
      contents: read # for actions/checkout
      security-events: write # for zizmor to upload SARIF results
    uses: open-telemetry/shared-workflows/.github/workflows/zizmor.yml@ee32c419ea90b05286c0cdc24538d970992cf82a # v0.11.0
    with:
      persona: pedantic
