name: OSSF Scorecard

on:
  push:
    branches:
      - main
  schedule:
    - cron: "15 2 * * 3" # once a week
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    permissions:
      contents: read
      id-token: write # for Scorecard to publish results
      security-events: write # for the SARIF upload to code scanning
    uses: open-telemetry/shared-workflows/.github/workflows/scorecard.yml@22c6d43ead71f463aa2b16ddb7081e94d2ad6a0e # v0.26.0
